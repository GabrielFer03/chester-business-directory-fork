<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diretório de Negócios de Chester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏛️ Diretório de Negócios de Chester</h1>
    <p>Encontre negócios locais em Chester, Reino Unido</p>
  </header>
  <div class="container">
    <div class="controls">
      <label for="search">Pesquisar negócios</label>
      <input type="text" id="search" placeholder="Digite o nome ou serviço...">
    </div>
    <div id="categories" class="categories"></div>
    <div id="grid" class="grid"></div>
  </div>
  <div id="modal" class="modal">
    <div id="modalBody" class="modal-content"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
